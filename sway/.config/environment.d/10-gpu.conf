# Laptop has an Intel iGPU (display-connected) + NVIDIA dGPU (proprietary driver, no display output).
# Restrict wlroots/sway to the Intel device so it never probes/uses the NVIDIA GPU,
# which avoids the "Proprietary GPU drivers are not supported by sway" warning.
WLR_DRM_DEVICES=/dev/dri/by-path/pci-0000:00:02.0-card
